<!DOCTYPE html>
<html ng-app="portal">
<head>
    <title></title>
    <meta http-equiv="X-UA-Compatible" content="IE=EDGE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
      <link rel="stylesheet" href="app.full.min.css">
  </head>
<body>

    <!--

        Grunt commands
        - grunt serve - run web portal on localhot:90001
        - grunt build - builds the site ready for deployment from the dist folder

        Yeoman commands for cg-angular. This is the generate used to create the portal

        yo cg-angular:directive my-awesome-directive
        yo cg-angular:partial my-partial
        yo cg-angular:service my-service
        yo cg-angular:filter my-filter
        yo cg-angular:module my-module
        yo cg-angular:modal my-modal

        -->
    <!-- Livereload script for development only (stripped during dist build) -->
    <script src="http://localhost:35729/livereload.js" data-concat="false"></script>

    <!-- JS from Bower Components -->
    <!-- Add New Bower Component JS Above -->
    <!-- Shared JS -->
    <!-- Add New Shared Component JS Above -->

    <!--
        Augment slot: the augmented portal hosts (e.g. Janison.SupportPortal) drop
        an /augment/init.js into the augment static root, where it pushes nav +
        state descriptors into window.RxnsPortalAugments BEFORE app.js bootstraps
        angular. Hosts without an augment 404 here and the onerror=this.remove
        keeps the console silent. See AppStatusPortal.cs (UseFileServer /augment).

        data-concat="false" so build.mjs DOESN'T fold this into app.full.min.js —
        the file is host-specific, served from the augment overlay, and must
        remain a separate <script> tag the browser loads at runtime.
    -->
    <script src="augment/init.js" onerror="this.remove()" data-concat="false"></script>

    <!-- Main App JS -->
    <!-- Add New Component JS Above -->

    <!--
        Augment post-loader: runs AFTER all base scripts (incl. app.js which
        defines the `portal` module) so per-augment controllers can register
        on `portal` without hitting "no module: portal". /augment/load.js
        reads window.RxnsPortalAugments[].scripts (populated by init.js earlier
        in <head>) and document.writes one <script> tag per controller. Same
        404-on-no-augment fail-soft contract as init.js.
    -->
    <div>
        <div id="content" class="container">
            <div class="row">
                <div ui-view>
                </div>
            </div>
        </div>
    </div>

    <!-- Always-on AI ask-bubble. Mounted OUTSIDE <ui-view> on purpose:
         route changes do not destroy it, so the conversation + live
         monitor-suggestions stack survive when you navigate between
         pages (state lives in aiBubbleService). -->
    <ai-bubble></ai-bubble>

  <script src="app.full.min.js"></script>
  <script src="augment/load.js" onerror="this.remove()" data-concat="false"></script>
</body>
</html>
